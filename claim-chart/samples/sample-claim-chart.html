<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Chart</title>
<!--
  Claim chart page. build.py fills the two placeholders in the cc-data and cc-schema blocks
  below and writes one self-contained .html. Layout of this file:
    <style>   1 colour tokens  2 header  3 claim box and panes  4 tree rows  5 overview tables
    <script>  1 boot and state  2 texts  3 helpers  4 index  5 evaluation  6 rendering
              7 actions (every control has data-act="name")  8 bars  9 save and JSON  10 start
  DESIGN.md explains the data model and how to extend it.
-->
<style>
/* ---- 1 colour tokens: T = True (pink), F = False (green), U = TBD (orange), N = No need (grey) */
:root {
  --T-bg: #fbd3e0; --T-bd: #d6336c; --F-bg: #cdeed5; --F-bd: #2f9e44;
  --U-bg: #ffe0b8; --U-bd: #f08c00; --N-bg: #e9ecef; --N-bd: #868e96;
  --ink: #1f2328; --sub: #57606a; --line: #d0d7de; --paper: #ffffff; --tint: #f6f8fa;
  --link: #0969da; --mark: #fff3a3; --markbd: #d4a72c; --trc: #0b7285;
  --and: #6639ba; --or: #0969da; --not: #cf222e; --warn: #9a3412; --memo: #5a3e00;
  --hdh: 120px; --fs: 14px; --ofs: 14px; --split: 40%;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --T-bg: #5a1f35; --T-bd: #f06595; --F-bg: #1c3f27; --F-bd: #51cf66;
  --U-bg: #4a3213; --U-bd: #ffa94d; --N-bg: #262b31; --N-bd: #6e7681;
  --ink: #e6edf3; --sub: #9da7b3; --line: #3d444d; --paper: #0d1117; --tint: #161b22;
  --link: #58a6ff; --mark: #6b5a00; --markbd: #e3b341; --trc: #66d9e8;
  --and: #b197fc; --or: #74c0fc; --not: #ff6b6b; --warn: #ffa94d; --memo: #ffd8a8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font: var(--fs)/1.45 system-ui, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; color: var(--ink); background: var(--paper); }
button, input, select, textarea { font: inherit; color: var(--ink); }
button { cursor: pointer; background: var(--tint); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
select, textarea, input[type="number"] { background: var(--paper); border: 1px solid var(--line); }
input[type="number"] { width: 3.6em; }
a { color: var(--link); }
.badge { display: inline-block; padding: 0 8px; border-radius: 10px; border: 1px solid; font-weight: 700; }
.badge.v-T { background: var(--T-bg); border-color: var(--T-bd); }
.badge.v-F { background: var(--F-bg); border-color: var(--F-bd); }
.badge.v-U { background: var(--U-bg); border-color: var(--U-bd); }
.badge.v-N { background: var(--N-bg); border-color: var(--N-bd); color: var(--sub); }
.tag { font-size: 0.79em; border: 1px solid var(--sub); border-radius: 3px; padding: 0 3px; color: var(--sub); margin-left: 4px; white-space: nowrap; }
.tag.diff { border-color: var(--not); color: var(--not); font-weight: 700; }
.note { color: var(--sub); font-size: 0.86em; }
.trc { color: var(--trc); }

/* ---- 2 header (sticky) */
#hd { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 2px solid var(--line); padding: 4px 10px; }
.hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 2px 0; }
.hrow label { white-space: nowrap; }
.tab { border-bottom: none; padding: 2px 10px; border-radius: 6px 6px 0 0; }
.tab.on { background: var(--paper); font-weight: 700; border-color: var(--ink); }
.sp { flex: 1; }
.info span + span::before { content: "｜"; color: var(--sub); margin: 0 2px; }
.grp { border-left: 1px solid var(--line); padding-left: 8px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button.on { background: var(--link); color: #fff; border-color: var(--link); }
.disc { color: var(--warn); font-size: 0.86em; }
.banner { background: var(--U-bg); border: 1px solid var(--U-bd); border-radius: 4px; padding: 1px 8px; font-weight: 700; }
#sum { max-height: 45vh; overflow: auto; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
#sum h4 { margin: 4px 0 2px; font-size: 0.93em; }
#sum pre { margin: 0 0 6px; white-space: pre-wrap; font: inherit; background: var(--tint); padding: 4px 6px; border-radius: 4px; }
#toast { position: fixed; right: 12px; bottom: 12px; z-index: 30; background: var(--tint); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; display: none; white-space: pre-wrap; }

/* ---- 3 claim box: by default it fits its content (the longer pane, no inner scroll, no blank
   tail) and the claim text stays on screen while a longer tree scrolls past. Dragging the bottom
   bar fixes the height (--ch) and both panes scroll inside; double-click goes back to fitting. */
#mn { padding: 6px 10px 40vh; }
.claim { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 8px; }
.claim > h3 { margin: 0; padding: 2px 8px; font-size: 1em; background: var(--tint); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.claim.open > h3 { border-bottom: 1px solid var(--line); }
.claim > h3 .sub { font-weight: 400; color: var(--sub); }
.cbody { display: grid; grid-template-columns: minmax(0, var(--split)) 6px minmax(0, 1fr); }
.bar-mid { cursor: col-resize; background: var(--line); }
.bar-bottom { height: 6px; cursor: row-resize; background: var(--line); border-radius: 0 0 6px 6px; }
.bar-mid:hover, .bar-bottom:hover, .dragging { background: var(--link); }
.orig { padding: 4px 0 4px 6px; min-width: 0; min-height: 0; }
.orig .inner { position: sticky; top: calc(var(--hdh) + 4px); max-height: calc(100vh - var(--hdh) - 16px); overflow: auto; padding-right: 6px; }
.chart { padding: 2px 0; min-width: 0; min-height: 0; }
.cbody.fixed { height: var(--ch); grid-template-rows: minmax(0, 1fr); }
.cbody.fixed .orig .inner { position: relative; top: 0; height: 100%; max-height: none; }
.cbody.fixed .chart { overflow: auto; }
body.tb .cbody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 6px auto; }
body.tb .bar-mid { cursor: row-resize; }
body.tb .orig .inner { position: relative; top: 0; max-height: none; }
body.tb .cbody.ohfix .orig .inner { height: var(--oh); }
body.tb .cbody.fixed { grid-template-rows: minmax(0, 40%) 6px minmax(0, 1fr); }
body.tb .cbody.fixed.ohfix { grid-template-rows: minmax(0, var(--oh)) 6px minmax(0, 1fr); }
.otool { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.86em; margin-bottom: 2px; position: sticky; top: 0; background: var(--paper); }
.ng { color: var(--not); font-weight: 700; }
.otext { white-space: pre-wrap; margin: 0; font: var(--ofs)/1.5 system-ui, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; cursor: text; }
.otext mark { background: var(--mark); color: inherit; outline: 1px solid var(--markbd); }
.otext .trc { display: inline; }
textarea.oedit { width: 100%; min-height: 95%; font: var(--ofs)/1.5 system-ui, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; resize: vertical; }

/* ---- 4 tree rows */
.row { display: flex; align-items: flex-start; gap: 4px; padding: 1px 6px 1px 0; border-left: 4px solid transparent; margin: 1px 0; }
.row.v-T { background: var(--T-bg); border-left-color: var(--T-bd); }
.row.v-F { background: var(--F-bg); border-left-color: var(--F-bd); }
.row.v-U { background: var(--U-bg); border-left-color: var(--U-bd); }
.row.v-N { background: var(--N-bg); border-left-color: var(--N-bd); color: var(--sub); }
.row.hl { outline: 2px solid var(--markbd); }
.row.flash { animation: flash 1.2s; }
@keyframes flash { 0%, 60% { outline: 3px solid var(--link); } 100% { outline: 0 solid transparent; } }
.tw { width: 14px; flex: none; text-align: center; color: var(--sub); cursor: pointer; user-select: none; }
.lb { flex: none; min-width: 3.4em; font-weight: 700; font-size: 0.86em; padding-top: 1px; }
.g { flex: none; font-size: 0.79em; font-weight: 700; border-radius: 3px; padding: 0 4px; margin-top: 2px; border: 1px solid var(--sub); color: var(--sub); background: var(--paper); }
.g-and { border-color: var(--and); color: var(--and); }
.g-or { border-color: var(--or); color: var(--or); }
.g-not { border-color: var(--not); color: #fff; background: var(--not); }
.tx { flex: 1; min-width: 0; cursor: pointer; }
.hole { color: var(--sub); font-size: 0.86em; }
.sub-line { display: block; font-size: 0.86em; }
.ie { color: var(--sub); }
.mtxt { color: var(--memo); white-space: pre-wrap; }
.ai { display: block; font-size: 0.86em; border-left: 3px solid var(--link); padding-left: 6px; margin-top: 1px; }
.ai .ev { display: block; color: var(--sub); }
.ck { flex: none; display: inline-flex; }
.ck button { border-radius: 0; padding: 0 5px; font-size: 0.86em; line-height: 1.5; margin-left: -1px; background: var(--paper); }
.ck button:first-child { border-radius: 4px 0 0 4px; }
.ck button:last-child { border-radius: 0 4px 4px 0; }
.ck button:disabled { cursor: default; opacity: .85; }
.ck button.on.b-T { background: var(--T-bd); color: #fff; border-color: var(--T-bd); }
.ck button.on.b-F { background: var(--F-bd); color: #fff; border-color: var(--F-bd); }
.ck button.on.b-U { background: var(--U-bd); color: #fff; border-color: var(--U-bd); }
.ck.alt button.on { background: var(--link); color: #fff; border-color: var(--link); }
.mm { flex: none; border: none; background: none; padding: 0 2px; opacity: .35; }
.mm.has { opacity: 1; }
.memo textarea { width: 100%; min-height: 3em; }

/* ---- 5 overview tables */
h2 { font-size: 1.14em; margin: 10px 0 4px; }
table.rep { border-collapse: collapse; margin: 4px 0 12px; width: 100%; }
table.rep th, table.rep td { border: 1px solid var(--line); padding: 2px 6px; text-align: left; vertical-align: top; }
table.rep th { background: var(--tint); }
td[data-act="jump"] { cursor: pointer; }
td[data-act="jump"]:hover { background: var(--tint); }

@media (max-width: 760px) {
  .cbody, body.tb .cbody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 6px auto; }
  .orig .inner { position: relative; top: 0; max-height: 60vh; }
}
</style>
</head>
<body>
<header id="hd"></header>
<main id="mn"></main>
<div id="toast"></div>
<input type="file" id="jsonFile" data-act="jsonFile" accept=".json,application/json" hidden>
<script type="application/json" id="cc-data">{"uiLang":"ja","generated":"2026-10-23 22:55","patents":[{"id":"US5946647","country":"US","number":"US 5,946,647","title":"System and method for performing an action on a structure in computer-generated data","holder":"Apple Computer Inc","filed":"1996-02-01","registered":"1999-08-31","status":"Expired - Lifetime（Google Patents の表示、2026-10-23 に確認）","source":"https://patents.google.com/patent/US5946647A/en","origLang":"en","summaryList":[{"role":"problem","heading":"BACKGROUND OF THE INVENTION","text":"1. Field of the Invention\nThis invention relates generally to manipulation of structures in computer data. More particularly, the invention relates to a system and method for performing computer-based actions on structures identified in computer data.\n2. Description of the Background Art\nMuch data that appears in a computer user's day-to-day activities contains recognizable structures that have semantic significance such as phone numbers, e-mail addresses, post-office addresses, zip codes and dates. In a typical day, for example, a user may receive extensive files from word-processing programs and e-mail that contain several of these structures. However, visually searching data files or documents to find these structures is laborious and cognitively disruptive, especially if the document is lengthy and hard to follow. Furthermore, missing a structure such as a date may lead to missing an important meeting or missing a deadline.\nTo help facilitate searching a document for these structures, programmers can create or employ pattern analysis units, such as parsers, to automatically identify the structures. For the purposes of the present description, the term \"pattern\" refers to data, such as a grammar, regular expression, string, etc., used by a pattern analysis unit to recognize information in a document, such as dates, addresses, phone numbers, names, etc. The term \"structure\" refers to an instantiation of a pattern in the document. That is, a \"date\" pattern will recognize the structure \"Oct. 31, 1995.\" The application of a pattern to a document is termed \"parsing.\"\nConventional systems that identify structures in computer data do not enable automatic performance of an action on an identified structure. For example, if a long e-mail message is sent to a user, the user may implement a pattern analysis unit to search for particular structures, such as telephone numbers. Upon identification of a structure, the user may want to perform an action on the structure, such as moving the number to an electronic telephone book. This usually involves cutting the structure from the e-mail message, locating and opening the electronic telephone book application program, pasting the structure into the appropriate field, and closing the application program. However, despite the fact that computer systems are getting faster and more efficient, this procedure is still tedious and cognitively disruptive.\nOne type of system that has addressed this problem involves detecting telephone numbers. Such systems enable a user to select a telephone number and request that the application automatically dial the number. However, these systems do not recognize the selected data as a telephone number, and they generally produce an error message if the user selects invalid characters as a phone number. Also, they do not enable the performance of other candidate actions, such as moving the number to an electronic telephone book. That is, if a user wishes to perform a different action on an identified telephone number, such as storing the number in an address book, the user cannot automatically perform the action but must select and transfer the number to the appropriate data base as described above.\nTherefore, a system is needed that identifies structures, associates candidate actions to the structures, enables selection of an action and automatically performs the selected action on the structure.","tr":{"ja":["発明の背景","1. 発明の分野","本発明は、広くはコンピュータのデータの中の構造の操作に関する。より詳しくは、コンピュータのデータの中で見分けた構造に対して、コンピュータによる動作を行うシステムと方法に関する。","2. 背景技術の説明","コンピュータの利用者が日々扱うデータの多くは、電話番号、電子メールのアドレス、郵便の住所、郵便番号、日付のように、意味を持つ見分けられる構造を含む。たとえば利用者は、1 日のうちに、ワープロのプログラムや電子メールから、こうした構造をいくつも含む大量のファイルを受け取る。しかし、データのファイルや文書を目で探してこうした構造を見つけるのは手間がかかり、思考を乱す。文書が長く追いにくいときは特にそうである。さらに、日付のような構造を見落とすと、大事な会議や締め切りを逃すことがある。","文書の中でこうした構造を探すのを助けるため、プログラマーは、構文解析器のようなパターン解析の部品を作ったり使ったりして、構造を自動で見分けることができる。この説明では、「パターン」とは、日付・住所・電話番号・名前などの文書の中の情報を見分けるためにパターン解析の部品が使う、文法・正規表現・文字列などのデータをいう。「構造」とは、文書の中のパターンの実例をいう。つまり、「日付」のパターンは「Oct. 31, 1995.」という構造を見分ける。パターンを文書に当てることを「構文解析（parsing）」という。","コンピュータのデータの中で構造を見分ける従来のシステムは、見分けた構造に対する動作を自動で行えるようにはしていない。たとえば、利用者に長い電子メールが届いたとき、利用者はパターン解析の部品を使って、電話番号のような特定の構造を探すかもしれない。構造が見つかると、利用者はその番号を電子の電話帳に移すといった動作をしたいかもしれない。これにはふつう、電子メールから構造を切り取り、電子の電話帳のアプリケーションを探して開き、構造を適切な欄に貼り付け、アプリケーションを閉じることが要る。コンピュータが速く効率よくなっても、この手順は依然として面倒で、思考を乱す。","この問題に取り組んだシステムの 1 つに、電話番号を検出するものがある。こうしたシステムでは、利用者が電話番号を選び、アプリケーションにその番号へ自動で電話をかけさせることができる。しかし、こうしたシステムは選んだデータを電話番号として認識しておらず、利用者が電話番号として無効な文字を選ぶと、ふつう誤りのメッセージを出す。また、番号を電子の電話帳に移すといった、ほかの候補の動作を行えるようにはしていない。つまり、利用者が見分けた電話番号に、住所録に記憶するといった別の動作をしたいときは、その動作を自動では行えず、上に述べたように番号を選んで適切なデータベースへ移さなければならない。","したがって、構造を見分け、構造に候補の動作を関連付け、動作を選べるようにし、選んだ動作を構造に対して自動で行うシステムが求められている。"]}},{"role":"solution","heading":"SUMMARY OF THE INVENTION","text":"The present invention overcomes the limitations and deficiencies of previous systems with a system that identifies structures in computer data, associates candidate actions with each detected structure, enables the selection of an action, and automatically performs the selected action on the identified structure. It will be appreciated that the system may operate on recognizable patterns for text, pictures, tables, graphs, voice, etc. So long as a pattern is recognizable, the system will operate on it. The present invention has significant advantages over previous systems, in that the present system may incorporate an open-ended number and type of recognizable patterns, an open-ended number and type of pattern analysis units, and further that the system may enable an open-ended number and type (i.e. scripts, macros, code fragments, etc.) of candidate actions to associate with, and thus perform, on each identified structure.\nThe present invention provides a computer system with a central processing unit (CPU), input/output (I/O) means, and a memory that includes a program to identify structures in a document and perform selected computer-based actions on the identified structures. The program includes program subroutines that include an analyzer server, an application program interface, a user interface and an action processor. The analyzer server receives data from a document having recognizable structures, and uses patterns to detect the structures. Upon detection of a structure, the analyzer server links actions to the detected structure. Each action is a computer subroutine that causes the CPU to perform a sequence of operations on the particular structure to which it is linked. An action may specify opening another application, loading the identified structure into an appropriate field, and closing the application. An action may further include internal actions, such as storing phone numbers in an electronic phone book, addresses in an electronic address book, appointments on an electronic calendar, and external actions such as returning phone calls, drafting letters, sending facsimile copies and e-mail, and the like.\nSince the program may be executed during the run-time of another program, i.e. the application which presents the document, such as Microsoft Word, an application program interface provides mechanisms for interprogram communications. The application program interface retrieves and transmits relevant information from the other program to the user interface for identifying, presenting and enabling selection of detected structures. Upon selection of a detected structure, the user interface presents and enables selection of candidate actions. When a candidate action is selected, the action processor performs the selected action on the selected structure.\nIn addition to the computer system, the present invention also provides methods for performing actions on identified structures in a document. In this method, the document is analyzed using a pattern to identify corresponding structures. Identified structures are stored in memory and presented to the user for selection. Upon selection of an identified structure, a menu of candidate actions is presented, each of which may be selected and performed on the selected structure.","tr":{"ja":["発明の概要","本発明は、コンピュータのデータの中の構造を見分け、検出した構造のそれぞれに候補の動作を関連付け、動作を選べるようにし、選んだ動作を見分けた構造に対して自動で行うシステムによって、従来のシステムの限界と欠点を克服する。このシステムは、文字・絵・表・グラフ・音声などの見分けられるパターンに対して働けることが分かるだろう。パターンが見分けられる限り、システムはそれに対して働く。本発明は従来のシステムに比べて大きな利点を持つ。このシステムは、見分けられるパターンの数と種類、パターン解析の部品の数と種類を限りなく取り込め、さらに、見分けた構造のそれぞれに関連付けて行う候補の動作の数と種類（スクリプト・マクロ・コードの断片など）も限りなく扱えるからである。","本発明は、中央処理装置（CPU）、入出力（I/O）の手段、およびメモリを持つコンピュータシステムを提供する。メモリは、文書の中の構造を見分け、見分けた構造に対して選んだコンピュータの動作を行うプログラムを含む。プログラムは、アナライザーサーバー、アプリケーションプログラムインターフェース、ユーザーインターフェース、および動作プロセッサを含むサブルーチンを持つ。アナライザーサーバーは、見分けられる構造を持つ文書からデータを受け取り、パターンを使って構造を検出する。構造を検出すると、アナライザーサーバーはその構造に動作を結び付ける。各動作は、結び付けた構造に対して CPU に一連の操作を行わせるコンピュータのサブルーチンである。動作は、別のアプリケーションを開き、見分けた構造を適切な欄に読み込み、アプリケーションを閉じることを指定できる。動作はさらに、電話番号を電子の電話帳に、住所を電子の住所録に、約束を電子の予定表に記憶するといった内部の動作や、折り返しの電話、手紙の下書き、ファクスや電子メールの送信といった外部の動作を含みうる。","このプログラムは、文書を提示するアプリケーション（たとえば Microsoft Word）のような別のプログラムの実行中に実行されることがあるので、アプリケーションプログラムインターフェースがプログラムどうしの通信の仕組みを提供する。アプリケーションプログラムインターフェースは、検出した構造を見分け、提示し、選べるようにするために、別のプログラムから必要な情報を取り出してユーザーインターフェースへ送る。検出した構造が選ばれると、ユーザーインターフェースは候補の動作を提示して選べるようにする。候補の動作が選ばれると、動作プロセッサは選んだ構造に対して選んだ動作を行う。","コンピュータシステムに加えて、本発明は、文書の中で見分けた構造に対して動作を行う方法も提供する。この方法では、パターンを使って文書を解析し、対応する構造を見分ける。見分けた構造はメモリに記憶し、選べるように利用者に提示する。見分けた構造が選ばれると候補の動作のメニューを提示し、そのそれぞれを選んで、選んだ構造に対して行える。"]}}],"claims":[{"n":1,"header":"1.","body":"A computer-based system for detecting structures in data and performing actions on detected structures, comprising:\nan input device for receiving data;\nan output device for presenting the data;\na memory storing information including program routines including\nan analyzer server for detecting structures in the data, and for linking actions to the detected structures;\na user interface enabling the selection of a detected structure and a linked action; and\nan action processor for performing the selected action linked to the selected structure; and\na processing unit coupled to the input device, the output device, and the memory for controlling the execution of the program routines.","tree":{"k":"and","parts":[{"k":"leaf","parts":["A computer-based system for detecting structures in data and performing actions on detected structures, comprising:"],"id":"1A","label":"1A","s":0,"e":115,"tr":{"ja":"データの中の構造を検出し、検出した構造に対して動作を行う、コンピュータを用いたシステムであって、次を備える:"}},"\n",{"k":"leaf","parts":["an input device for receiving data;"],"id":"1B","label":"1B","s":116,"e":151,"tr":{"ja":"データを受け取る入力装置;"}},"\n",{"k":"leaf","parts":["an output device for presenting the data;"],"id":"1C","label":"1C","s":152,"e":193,"tr":{"ja":"データを提示する出力装置;"}},"\n",{"k":"and","parts":["a memory storing information including program routines including\n",{"k":"and","parts":[{"k":"and","parts":["an analyzer server ",{"k":"and","parts":[{"k":"leaf","parts":["for detecting structures in the data"],"id":"1D.1.1.1.1","label":"1D.1.1.1.1","s":279,"e":315,"tr":{"ja":"データの中の構造を検出するための"}},", and ",{"k":"leaf","parts":["for linking actions to the detected structures"],"id":"1D.1.1.1.2","label":"1D.1.1.1.2","s":321,"e":367,"tr":{"ja":"検出した構造に動作を結び付けるための"}}],"own":false,"alt":false,"id":"1D.1.1.1","label":"1D.1.1.1","s":279,"e":367},";"],"own":true,"alt":false,"id":"1D.1.1","label":"1D.1.1","s":260,"e":368,"tr":{"ja":"アナライザーサーバー（analyzer server） ［1D.1.1.1］;"}},"\n",{"k":"leaf","parts":["a user interface enabling the selection of a detected structure and a linked action;"],"id":"1D.1.2","label":"1D.1.2","s":369,"e":453,"tr":{"ja":"検出した構造と、結び付けた動作とを選べるようにするユーザーインターフェース;"}}," and\n",{"k":"leaf","parts":["an action processor for performing the selected action linked to the selected structure;"],"id":"1D.1.3","label":"1D.1.3","s":458,"e":546,"tr":{"ja":"選んだ構造に結び付けた、選んだ動作を行う動作プロセッサ;"}}],"own":false,"alt":false,"id":"1D.1","label":"1D.1","s":260,"e":546}," and"],"own":true,"alt":false,"id":"1D","label":"1D","s":194,"e":550,"tr":{"ja":"プログラムのルーチンを含む情報を記憶するメモリであって、そのルーチンは次を含む: ［1D.1］ そして"}},"\n",{"k":"and","parts":["a processing unit coupled to ",{"k":"and","parts":[{"k":"leaf","parts":["the input device"],"id":"1E.1.1","label":"1E.1.1","s":580,"e":596,"tr":{"ja":"入力装置"}},", ",{"k":"leaf","parts":["the output device"],"id":"1E.1.2","label":"1E.1.2","s":598,"e":615,"tr":{"ja":"出力装置"}},", and ",{"k":"leaf","parts":["the memory"],"id":"1E.1.3","label":"1E.1.3","s":621,"e":631,"tr":{"ja":"メモリ"}}],"own":false,"alt":false,"id":"1E.1","label":"1E.1","s":580,"e":631}," for controlling the execution of the program routines."],"own":true,"alt":false,"id":"1E","label":"1E","s":551,"e":686,"tr":{"ja":"［1E.1］ につながり、プログラムのルーチンの実行を制御する処理装置。"}}],"own":false,"alt":false,"id":"1","label":"1","s":0,"e":686},"trLines":{"ja":["データの中の構造を検出し、検出した構造に対して動作を行う、コンピュータを用いたシステムであって、次を備える:","データを受け取る入力装置;","データを提示する出力装置;","プログラムのルーチンを含む情報を記憶するメモリであって、そのルーチンは次を含む:","データの中の構造を検出するため、および検出した構造に動作を結び付けるためのアナライザーサーバー;","検出した構造と、結び付けた動作とを選べるようにするユーザーインターフェース; そして","選んだ構造に結び付けた、選んだ動作を行う動作プロセッサ; そして","入力装置、出力装置、およびメモリにつながり、プログラムのルーチンの実行を制御する処理装置。"]}},{"n":2,"header":"2.","body":"The system recited in claim 1, wherein the analyzer server stores detected structures in the memory.","tree":{"k":"and","parts":[{"k":"ref","ref":1,"parts":["The system recited in claim 1"],"id":"2A","label":"2A","s":0,"e":29,"tr":{"ja":"請求項 1 のシステム"}},", wherein ",{"k":"leaf","parts":["the analyzer server stores detected structures in the memory."],"id":"2B","label":"2B","s": 分けない。"}]},"23B":{"v":"F","reason":"決め手。音声では操作しない。","evidence":[{"file":"target-sample/device-spec.md","line":22,"quote":"音声では操作しない。"}]},"24B":{"v":"U","reason":"動作が別の動作を呼ぶかは仕様に記述なし（記述が無いことは「無い」ことではない）。","evidence":[]}}}},{"id":"US8046721","country":"US","number":"US 8,046,721","title":"Unlocking a device by performing gestures on an unlock image","holder":"Apple Inc","filed":"2009-06-02","registered":"2011-10-25","status":"Expired - Lifetime（Google Patents の表示、2026-10-23 に確認）","source":"https://patents.google.com/patent/US8046721B2/en","origLang":"en","summaryList":[{"role":"problem","heading":"BACKGROUND","text":"Touch-sensitive displays (also known as “touch screens” or “touchscreens”) are well known in the art. Touch screens are used in many electronic devices to display graphics and text, and to provide a user interface through which a user may interact with the devices. A touch screen detects and responds to contact on the touch screen. A device may display one or more soft keys, menus, and other user-interface objects on the touch screen. A user may interact with the device by contacting the touch screen at locations corresponding to the user-interface objects with which she wishes to interact.\nTouch screens are becoming more popular for use as displays and as user input devices on portable devices, such as mobile telephones and personal digital assistants (PDAs). One problem associated with using touch screens on portable devices is the unintentional activation or deactivation of functions due to unintentional contact with the touch screen. Thus, portable devices, touch screens on such devices, and/or applications running on such devices may be locked upon satisfaction of predefined lock conditions, such as upon entering an active call, after a predetermined time of idleness has elapsed, or upon manual locking by a user.\nDevices with touch screens and/or applications running on such devices may be unlocked by any of several well-known unlocking procedures, such as pressing a predefined set of buttons (simultaneously or sequentially) or entering a code or password. These unlock procedures, however, have drawbacks. The button combinations may be hard to perform. Creating, memorizing, and recalling passwords, codes, and the like can be quite burdensome. These drawbacks may reduce the ease of use of the unlocking process and, as a consequence, the ease of use of the device in general.\nAccordingly, there is a need for more efficient, user-friendly procedures for unlocking such devices, touch screens, and/or applications. More generally, there is a need for more efficient, user-friendly procedures for transitioning such devices, touch screens, and/or applications between user interface states (e.g., from a user interface state for a first application to a user interface state for a second application, between user interface states in the same application, or between locked and unlocked states). In addition, there is a need for sensory feedback to the user regarding progress towards satisfaction of a user input condition that is required for the transition to occur.","tr":{"ja":["背景","タッチ画面（「touch screens」「touchscreens」とも呼ぶ）はよく知られている。タッチ画面は多くの電子機器で、図形や文字を表示し、利用者が機器を操作するユーザーインターフェースとして使われる。タッチ画面は、画面への接触を検出して応じる。機器は、ソフトキー・メニューなどのユーザーインターフェースの部品をタッチ画面に表示できる。利用者は、操作したい部品の位置で画面に触れて、機器を操作する。","タッチ画面は、携帯電話や PDA などの携帯機器の表示と入力に広く使われるようになっている。携帯機器でタッチ画面を使うときの問題は、意図しない接触で機能が入ったり切れたりすることである。そのため、携帯機器・その画面・その上のアプリは、通話中になったとき、決めた時間操作がなかったとき、利用者が手で鍵をかけたときなど、決めたロックの条件を満たすとロックされることがある。","タッチ画面を持つ機器やその上のアプリのロックは、決めたボタンの組を（同時に、または順に）押す、コードやパスワードを入れるなど、よく知られたいくつかの手順で外せる。しかしこれらの手順には欠点がある。ボタンの組み合わせは押しにくいことがある。パスワードやコードを作り、覚え、思い出すのはかなりの負担になる。こうした欠点は、ロック解除の使いやすさを下げ、ひいては機器全体の使いやすさを下げる。","したがって、こうした機器・タッチ画面・アプリのロックを外す、より効率がよく使いやすい手順が求められている。より広くは、こうした機器・タッチ画面・アプリを、ユーザーインターフェースの状態のあいだで移す（たとえば、第 1 のアプリの状態から第 2 のアプリの状態へ、同じアプリの中の状態のあいだで、またはロック状態とロック解除状態のあいだで）、より効率がよく使いやすい手順が求められている。さらに、移るために必要な入力の条件をどこまで満たしたかを、感覚で利用者に返すことも求められている。"]}},{"role":"solution","heading":"SUMMARY","text":"In some embodiments, a method of controlling an electronic device with a touch-sensitive display includes: detecting contact with the touch-sensitive display while the device is in a user-interface lock state; moving an image corresponding to a user-interface unlock state of the device in accordance with the contact; transitioning the device to the user-interface unlock state if the detected contact corresponds to a predefined gesture; and maintaining the device in the user-interface lock state if the detected contact does not correspond to the predefined gesture.\nIn some embodiments, a method of controlling a device with a touch-sensitive display includes: displaying an image on the touch-sensitive display while the device is in a user-interface lock state; detecting contact with the touch-sensitive display; transitioning the device to a user-interface unlock state if the detected contact corresponds to moving the image to a predefined location on the touch-sensitive display; and maintaining the device in the user-interface lock state if the detected contact does not correspond to moving the image to the predefined location.\nIn some embodiments, a method of controlling a device with a touch-sensitive display includes: displaying an image on the touch-sensitive display while the device is in a user-interface lock state; detecting contact with the touch-sensitive display; and transitioning the device to a user-interface unlock state if the detected contact corresponds to moving the image on the touch-sensitive display according to a predefined path on the touch-sensitive display; and maintaining the device in the user-interface lock state if the detected contact does not correspond to moving the image according to the predefined path.\nIn some embodiments, a method of controlling a device with a touch-sensitive display includes: displaying first and second images on the touch-sensitive display while the device is in a user-interface lock state; detecting contact with the touch-sensitive display; transitioning the device to a first active state corresponding to the first image if the detected contact corresponds to a predefined gesture with respect to the first image; and transitioning the device to a second active state distinct from the first active state if the detected contact corresponds to a predefined gesture with respect to the second image.\nThe aforementioned methods may be performed by a portable electronic device having a touch-sensitive display with a graphical user interface (GUI), one or more processors, memory and one or more modules, programs or sets of instructions stored in the memory for performing these methods. In some embodiments, the portable electronic device provides a plurality of functions, including wireless communication.\nInstructions for performing the aforementioned methods may be included in a computer program product configured for execution by one or more processors. In some embodiments, the executable computer program product includes a computer readable storage medium (e.g., one or more magnetic disk storage devices, flash memory devices, or other non-volatile solid state memory devices) and an executable computer program mechanism embedded therein.","tr":{"ja":["概要","いくつかの実施形態では、タッチ画面を持つ電子機器を制御する方法は次を含む: 機器がユーザーインターフェースのロック状態にあるあいだに、タッチ画面への接触を検出する; 機器のユーザーインターフェースのロック解除状態に対応する絵を、接触に合わせて動かす; 検出した接触が決めたジェスチャーに当たれば、機器をロック解除状態へ移す; 当たらなければ、機器をロック状態のままにする。","いくつかの実施形態では、タッチ画面を持つ機器を制御する方法は次を含む: 機器がロック状態にあるあいだ、タッチ画面に絵を表示する; タッチ画面への接触を検出する; 検出した接触が、絵をタッチ画面の上の決めた位置へ動かすことに当たれば、機器をロック解除状態へ移す; 当たらなければ、ロック状態のままにする。","いくつかの実施形態では、タッチ画面を持つ機器を制御する方法は次を含む: 機器がロック状態にあるあいだ、タッチ画面に絵を表示する; タッチ画面への接触を検出する; 検出した接触が、タッチ画面の上の決めた道筋に沿って絵を動かすことに当たれば、機器をロック解除状態へ移す; 当たらなければ、ロック状態のままにする。","いくつかの実施形態では、タッチ画面を持つ機器を制御する方法は次を含む: 機器がロック状態にあるあいだ、タッチ画面に第 1 と第 2 の絵を表示する; タッチ画面への接触を検出する; 検出した接触が第 1 の絵に対する決めたジェスチャーに当たれば、機器を第 1 の絵に対応する第 1 の動作状態へ移す; 第 2 の絵に対する決めたジェスチャーに当たれば、第 1 とは別の第 2 の動作状態へ移す。","上の方法は、グラフィカルユーザーインターフェース（GUI）を持つタッチ画面と、1 つ以上のプロセッサと、メモリと、メモリに置かれ、これらの方法を行う 1 つ以上のモジュール・プログラム・命令の組を持つ携帯型の電子機器で行える。いくつかの実施形態では、その携帯型の電子機器は、無線通信を含む複数の機能を持つ。","上の方法を行う命令は、1 つ以上のプロセッサで実行されるように構成されたコンピュータのプログラム製品に含められる。いくつかの実施形態では、その実行できるプログラム製品は、コンピュータで読める記憶媒体（たとえば、1 つ以上の磁気ディスク記憶装置、フラッシュメモリ、またはほかの不揮発性の固体メモリ）と、その中に組み込まれた実行できるプログラムの仕組みを含む。"]}}],"claims":[{"n":1,"header":"1.","body":"A method of unlocking a hand-held electronic device, the device including a touch-sensitive display, the method comprising:\ndetecting a contact with the touch-sensitive display at a first predefined location corresponding to an unlock image;\ncontinuously moving the unlock image on the touch-sensitive display in accordance with movement of the contact while continuous contact with the touch screen is maintained, wherein the unlock image is a graphical, interactive user-interface object with which a user interacts in order to unlock the device; and\nunlocking the hand-held electronic device if the moving the unlock image on the touch-sensitive display results in movement of the unlock image from the first predefined location to a predefined unlock region on the touch-sensitive display.","tree":{"k":"and","parts":[{"k":"leaf","parts":["A method of unlocking a hand-held electronic device, the device including a touch-sensitive display, the method comprising:"],"id":"1A","label":"1A","s":0,"e":123,"tr":{"ja":"携帯型の電子機器のロックを外す方法であって、その機器はタッチ画面を備え、その方法は次を含む:"}},"\n",{"k":"leaf","parts":["detecting a contact with the touch-sensitive display at a first predefined location corresponding to an unlock image;"],"id":"1B","label":"1B","s":124,"e":241,"tr":{"ja":"ロック解除の絵に対応する第 1 の決めた位置で、タッチ画面への接触を検出すること;"}},"\n",{"k":"and","parts":[{"k":"leaf","parts":["continuously moving the unlock image on the touch-sensitive display in accordance with movement of the contact while continuous contact with the touch screen is maintained"],"id":"1C.1","label":"1C.1","s":242,"e":413,"tr":{"ja":"タッチ画面への接触が続いているあいだ、接触の動きに合わせて、ロック解除の絵をタッチ画面の上で連続して動かすこと"}},", wherein ",{"k":"leaf","parts":["the unlock image is a graphical, interactive user-interface object with which a user interacts in order to unlock the device"],"id":"1C.2","label":"1C.2","s":423,"e":547,"tr":{"ja":"ロック解除の絵は、利用者が機器のロックを外すために操作する、図形の対話型のユーザーインターフェースの部品である"}},";"],"own":false,"alt":false,"id":"1C","label":"1C","s":242,"e":548}," and\n",{"k":"leaf","parts":["unlocking the hand-held electronic device if the moving the unlock image on the touch-sensitive display results in movement of the unlock image from the first predefined location to a predefined unlock region on the touch-sensitive display."],"id":"1D","label":"1D","s":553,"e":793,"tr":{"ja":"タッチ画面の上でロック解除の絵を動かした結果、その絵が第 1 の決めた位置からタッチ画面の上の決めたロック解除の領域まで動いたなら、携帯型の電子機器のロックを外すこと。"}}],"own":false,"alt":false,"id":"1","label":"1","s":0,"e":793},"trLines":{"ja":["携帯型の電子機器のロックを外す方法であって、その機器はタッチ画面を備え、その方法は次を含む:","ロック解除の絵に対応する第 1 の決めた位置で、タッチ画面への接触を検出すること;","タッチ画面への接触が続いているあいだ、接触の動きに合わせて、ロック解除の絵をタッチ画面の上で連続して動かすこと。ここで、ロック解除の絵は、利用者が機器のロックを外すために操作する、図形の対話型のユーザーインターフェースの部品である; そして","タッチ画面の上でロック解除の絵を動かした結果、その絵が第 1 の決めた位置からタッチ画面の上の決めたロック解除の領域まで動いたなら、携帯型の電子機器のロックを外すこと。"]}},{"n":2,"header":"2.","body":"The method of claim 1, wherein the moving comprises movement along any desired path.","tree":{"k":"and","parts":[{"k":"ref","ref":1,"parts":["The method of claim 1"],"id":"2A","label":"2A","s":0,"e":21,"tr":{"ja":"請求項 1 の方法"}},", wherein ",{"k":"leaf","parts":["the moving comprises movement along any desired path."],"id":"2B","label":"2B","s":31,"e":84,"tr":{"ja":"動かすことは、望む任意の道筋に沿った動きを含む。"}}],"own":false,"alt":false,"id":"2","label":"2","s":0,"e":84},"trLines":{"ja":["請求項 1 の方法であって、動かすことは、望む任意の道筋に沿った動きを含む。"]}},{"n":3,"header":"3.","body":"The method of claim 1, wherein the moving comprises movement along a predefined channel from the first predefined location to the predefined unlock region.","tree":{"k":"and","parts":[{"k":"ref","ref":1,"parts":["The method of claim 1"],"id":"3A","label":"3A","   act(name) + (S.ui[name] === value ? " checked" : "") + "> " + esc(label) + "</label>";

// ==================================================================== 4 index
// P[id] = patent; each node gets parent, depth, kids, claim and text (its span of the claim).
const P = {};
for (const p of DATA.patents) {

const nodeOfKey = (k) => { const i = k.indexOf(":"); const p = P[k.slice(0, i)]; return { p, node: p.byId[k.slice(i + 1)] }; };

// ==================================================================== 5 evaluation
// Two layers of answers: the person's (S.checks) and the AI's provisional ones (ai.json or an
// imported JSON). Every value below is computed for one layer m ("user" | "ai").
const LAYERS = ["user", "ai"];
function aiOf(p, node) {
  const imp = S.aiImp[key(p, node)];
  if (imp) return imp;
  return p.ai && p.ai.judgments[node.id] ? p.ai.judgments[node.id] : null;
}
function answer(p, node, m) {
  if (m === "ai") { const a = aiOf(p, node); return a ? a.v : "U"; }

const andV = (vs) => vs.includes("F") ? "F" : vs.includes("U") ? "U" : "T";
const orV = (vs) => vs.includes("T") ? "T" : vs.includes("U") ? "U" : "F";
function gateOf(p, node) {
  let g = (node.alt && S.alts[key(p, node)]) || node.k;

let cache = {};
function val(p, node, m = S.ui.view) {

    const inner = gateOf(p, node) === "and" ? andV(kv) : orV(kv);

}

// "Relevant" = this node can still change its ancestors. A TBD that is not relevant is "No need".

let rel = { user: {}, ai: {} };
function markRelevant(p, node, r, m) {
  const R = rel[m];
  const k = key(p, node);
  R[k] = r;
  if (!node.kids.length) { R[k + "#own"] = r; return; }
  if (node.k === "not") { markRelevant(p, node.kids[0], r, m); return; }
  const kv = node.kids.map((x) => val(p, x, m));
  const g = gateOf(p, node);
  const inner = g === "and" ? andV(kv) : orV(kv);
  let innerR = r;
  if (node.own) {
    const own = answer(p, node, m);
    const anyF = own === "F" || inner === "F";
    R[k + "#own"] = r && !(anyF && own !== "F");
    innerR = r && !(anyF && inner !== "F");
  }
  const decider = g === "and" ? "F" : "T";
  const decided = kv.includes(decider);
  node.kids.forEach((x, i) => markRelevant(p, x, innerR && !(decided && kv[i] !== decider), m));
}
function refresh() {
  cache = {};
  rel = { user: {}, ai: {} };
  for (const m of LAYERS) {
    for (const p of DATA.patents) {
      const cv = p.claims.map((c) => val(p, c.tree, m));
      const anyT = cv.includes("T");
      p.claims.forEach((c, i) => markRelevant(p, c.tree, !(anyT && cv[i] !== "T"), m));
    }
  }
}
const worth = (p, node, m = S.ui.view) => checkable(node) && answer(p, node, m) === "U" && !!rel[m][key(p, node) + "#own"];
function cat(p, node, m = S.ui.view) {
  const v = val(p, node, m);
  return v === "U" && !rel[m][key(p, node)] ? "N" : v;
}
function counts(p, m = S.ui.view) {
  const c = { T: 0, F: 0, U: 0, N: 0 };
  for (const node of p.nodes) {
    if (!checkable(node)) continue;
    const v = answer(p, node, m);
    c[v === "U" && !worth(p, node, m) ? "N" : v]++;
  }
  return c;
}
const countText = (c) => CATS.map((v) => esc(t(v)) + " " + c[v]).join(" / ");

// what is shown in the tree under the filters (S.ui.filter, S.ui.mode)
const shown = (v) => !!S.ui.filter[v];
const anyDescShown = (p, node) => node.kids.some((x) => shown(cat(p, x)) || anyDescShown(p, x));
function visible(p, node) {
  if (!node.parent) return true;
  const v = cat(p, node);
  return S.ui.mode === "branch" ? shown(v) : shown(v) || anyDescShown(p, node);
}

// translation of a node in the chosen language (an imported one wins), or null
function trOf(p, node) {
  if (!S.ui.tr) return null;
  const imp = S.trImp[key(p, node)];
  if (imp && imp[S.ui.tr]) return imp[S.ui.tr];
  return node.tr ? node.tr[S.ui.tr] || null : null;
}
// "orig" | "tr" | "both" for this claim: without a translation there is only the original
const textMode = (c) => (S.ui.tr && c.trLines && c.trLines[S.ui.tr] ? S.ui.text : "orig");

  document.querySelectorAll("[data-scroll]").forEach((el) => { scrolls[el.dataset.scroll] = el.scrollTop; });

}

// ---- claim text pane
// "orig": the text as the person formatted it (only spaces and line breaks may be edited);
// "tr" / "both": one line per claim line, translated or interleaved. Every line span carries its
// offset in the claim so a click can find the node under it.
const fmtKey = (p, c) => p.id + ":" + c.n;
function defaultFmt(c) {
  const lines = c.body.split("\n");
  return lines.map((l, i) => (i === 0 || i === lines.length - 1 ? l : "  " + l)).join("\n");
}
const fmtOf = (p, c) => S.fmt[fmtKey(p, c)] ?? defaultFmt(c);
const squash = (s) => s.replace(/\s+/g, "");
const fmtMatches = (p, c) => squash(fmtOf(p, c)) === squash(c.body);
// claim offset -> offset in the formatted text (they differ only in whitespace)
function offsetMap(body, fmt) {
  const map = new Array(body.length + 1);
  let j = 0;
  for (let i = 0; i < body.length; i++) {
    if (/\s/.test(body[i])) { map[i] = j; continue; }
    while (j < fmt.length && fmt[j] !== body[i]) j++;
    map[i] = j++;
  }
  map[body.length] = fmt.length;
  return map;
}
function highlighted(p, c) {
  if (!UI.hl) return null;
  const { p: hp, node } = nodeOfKey(UI.hl);
  return hp === p && node.claim === c.n ? node : null;
}
function paneHtml(p, c) {
  const fk = fmtKey(p, c);
  const ok = fmtMatches(p, c);
  const mode = textMode(c);
  const hl = highlighted(p, c);
  let h = '<div class="inner" data-scroll="pane:' + esc(fk) + '"><div class="otool"><b>' + esc(c.header) + "</b>";
  if (mode === "orig") h += "<button" + act("editText", fk) + ">" + esc(UI.edit[fk] ? t("view") : t("edit")) + "</button>";
  // the claim text is always checked against the original, but only a mismatch is shown
  h += '<span class="ng" data-okfor="' + esc(fk) + '">' + (ok ? "" : "✗ " + esc(t("mismatch"))) + "</span>";
  h += "</div>";
  if (mode === "orig" && UI.edit[fk]) return h + '<textarea class="oedit"' + act("fmtInput", fk) + ">" + esc(fmtOf(p, c)) + "</textarea></div>";
  return h + '<pre class="otext"' + act("pickText", fk) + ">" + (mode === "orig" ? formattedHtml(p, c, ok ? hl : null) : linesHtml(c, mode, hl)) + "</pre></div>";
}
function formattedHtml(p, c, hl) {
  const fmt = fmtOf(p, c);
  if (!hl) return esc(fmt);
  const m = offsetMap(c.body, fmt);
  return esc(fmt.slice(0, m[hl.s])) + "<mark>" + esc(fmt.slice(m[hl.s], m[hl.e])) + "</mark>" + esc(fmt.slice(m[hl.e]));
}
function linesHtml(c, mode, hl) {
  const lines = c.body.split("\n");
  const trl = c.trLines[S.ui.tr];
  const out = [];
  let off = 0;
  lines.forEach((ln, i) => {
    const ind = i === 0 || i === lines.length - 1 ? "" : "  ";
    const s0 = off, e0 = off + ln.length;
    const hit = hl && hl.e > s0 && hl.s < e0;
    if (mode === "both") {
      let body = esc(ln);
      if (hit) {
        const a = Math.max(hl.s, s0) - s0, b = Math.min(hl.e, e0) - s0;
        body = esc(ln.slice(0, a)) + "<mark>" + esc(ln.slice(a, b)) + "</mark>" + esc(ln.slice(b));
      }
      out.push(ind + '<span data-off="' + s0 + '">' + body + "</span>");
    }
    const tx = esc(trl[i]);
    out.push(ind + '<span class="trc" data-off="' + s0 + '" data-whole="1">' + (hit && mode === "tr" ? "<mark>" + tx + "</mark>" : tx) + "</span>");
    off = e0 + 1;
  });
  return out.join("\n");
}

// ---- tree
function treeHtml(p, c) {
  const out = [];
  (function walk(node) {
    const open = !S.collapsed[key(p, node)];
    if (visible(p, node)) out.push(rowHtml(p, node));
    else if (S.ui.mode === "trunk") return; // trunk: a hidden node has no shown descendants
    if (open) node.kids.forEach(walk);
  })(c.tree);
  return out.join("");
}
// a node's own wording with each child shown as [label]; runs of children collapse to [A~C]
function holeText(node) {
  const out = [];
  let run = [];
  const flush = () => {
    if (run.length) out.push('<span class="hole">［' + esc(run.length > 1 ? run[0] + "〜" + run[run.length - 1] : run[0]) + "］</span>");
    run = [];
  };
  for (const part of node.parts) {
    if (typeof part !== "string") { run.push(part.label); continue; }
    if (/^\s*$/.test(part)) continue;
    flush();
    out.push(esc(part.replace(/\n/g, " ")));
  }
  flush();
  return out.join("");
}
const GATE_NAMES = { and: "AND", or: "OR", not: "NOT" };
function rowHtml(p, node) {
  const k = key(p, node);
  const v = cat(p, node);
  let h = '<div class="row v-' + v + (UI.hl === k ? " hl" : "") + '" data-k="' + esc(k) + '" style="padding-left:' + node.depth * 16 + 'px">' +
    "<span class=\"tw\"" + act("twisty") + ">" + (node.kids.length ? (S.collapsed[k] ? "▸" : "▾") : "") + "</span>" +
    '<span class="lb">' + esc(node.label) + "</span>" + gateHtml(p, node) +
    '<span class="tx"' + act("rowText") + ">" + rowTextHtml(p, node) + (v === "N" ? '<span class="tag">' + esc(t("N")) + "</span>" : "") +
    (node.alt ? '<span class="tag">' + esc(t("ambig")) + "</span>" : "") + extrasHtml(p, node) + "</span>" + controlsOfRow(p, node) + "</div>";
  if (UI.memoOpen[k]) h += '<div class="memo" style="padding-left:' + (node.depth * 16 + 18) + 'px"><textarea' + act("memoInput", k) + ">" +
    esc(S.memos[k] || "") + "</textarea></div>";
  return h;
}
function gateHtml(p, node) {
  if (node.k === "opt") return '<span class="g">' + esc(t("opt")) + "</span>";
  if (node.k === "ref") return '<span class="g">' + esc(t("cites")) + "</span>";
  if (!node.kids.length) return "";
  const g = gateOf(p, node);
  const flipped = node.parent && node.parent.k === "not" ? GATE_NAMES[node.k] + "→" : "";
  return '<span class="g g-' + (node.k === "not" ? "not" : g) + '">' + flipped + (node.k === "not" ? "NOT" : GATE_NAMES[g]) + "</span>";
}
// the wording of the row in the chosen text mode; a translation is told apart by its colour only
function rowTextHtml(p, node) {
  const tr = trOf(p, node);
  const mode = textMode(p.byN[node.claim]);
  const orig = node.kids.length ? holeText(node) : esc(node.parts[0]);
  const trText = tr ? '<span class="trc">' + holesHtml(tr) + "</span>" : "";
  let h = mode === "tr" && tr ? trText : orig;
  if (node.k === "ref") {
    h = "<a href=\"#\"" + act("gotoClaim", node.ref) + ">" + h + "</a> → " + esc(t("claim")) + node.ref + " " + esc(t("refto")) + " " +
      badge(val(p, p.byN[node.ref].tree));
  }
  if (mode === "both" && tr) h += '<span class="sub-line">' + trText + "</span>";
  if (mode !== "orig" && tr && S.trImp[key(p, node)]) h += '<span class="tag">' + esc(t("trUnverified")) + "</span>";
  if (node.ie) h += '<span class="sub-line ie">i.e., ' + esc(node.ie) + "</span>";
  return h;
}
function extrasHtml(p, node) {
  const k = key(p, node);
  let h = S.memos[k] && !UI.memoOpen[k] ? '<span class="sub-line mtxt">✎ ' + esc(S.memos[k]) + "</span>" : "";
  const ai = checkable(node) ? aiOf(p, node) : null;
  if (ai && S.ui.aiReason) {
    h += '<span class="ai">' + esc(t("aiReasonHead")) + " " + badge(ai.v) + (S.aiImp[k] ? '<span class="tag">' + esc(t("aiUnverified")) + "</span>" : "") +
      " " + esc(ai.reason) + ai.evidence.map((e) => '<span class="ev">' + esc(e.file) + ":" + e.line + "「" + esc(e.quote) + "」</span>").join("") + "</span>";
  }
  return h;
}
function controlsOfRow(p, node) {
  const k = key(p, node);
  let h = "";
  if (node.alt) {
    const a = S.alts[k] || node.k;
    h += '<span class="ck alt" title="' + esc(t("reading")) + '">' + ["or", "and"].map((g) => '<button class="' + (a === g ? "on" : "") + '"' +
      act("reading", g) + ">" + g.toUpperCase() + "</button>").join("") + "</span>";
  }
  if (checkable(node)) {
    const ai = aiOf(p, node);
    if (S.ui.view === "user" && ai && ai.v !== "U") {
      const mine = answer(p, node, "user");
      const differs = mine !== "U" && mine !== ai.v;
      h += '<span class="tag' + (differs ? " diff" : "") + '">AI: ' + esc(t(ai.v)) + (differs ? " ／ " + esc(t("diff")) : "") + "</span>";
    }
    const cur = answer(p, node, S.ui.view);
    h += '<span class="ck">' + VALS.map((x) => '<button class="b-' + x + (cur === x ? " on" : "") + '"' + act("check", x) +
      (S.ui.view === "ai" ? " disabled" : "") + ">" + esc(t(x)) + "</button>").join("") + "</span>";
  }
  return h + '<button class="mm' + (S.memos[k] ? " has" : "") + '"' + act("memo") + ' title="' + esc(t("memo")) + '">✎</button>';
}

// bring the highlighted text into view inside its own pane (when the pane scrolls)
function revealMark() {
  const m = document.querySelector(".otext mark");
  if (!m) return;
  const box = m.closest(".inner");
  if (box.scrollHeight <= box.clientHeight) return;
  const top = m.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
  if (top < box.scrollTop + 24 || top + m.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, top - box.clientHeight / 3);
}

// ==================================================================== 7 actions
// Every control carries data-act="<name>" (and data-arg). ON_CLICK / ON_CHANGE / ON_INPUT map the
// name to what it does; a row-level action finds its row through the nearest [data-k].
function change() { dirty = true; render(); }
const rowOf = (el) => { const r = el.closest("[data-k]"); return r ? Object.assign({ k: r.dataset.k }, nodeOfKey(r.dataset.k)) : null; };
const confirmText = (name, n) => t(name).replace("{n}", n);

function goToNode(k) {
  const { p, node } = nodeOfKey(k);
  S.ui.tab = p.id;
  UI.show[p.id + ":" + node.claim] = true;
  for (let a = node.parent; a; a = a.parent) delete S.collapsed[key(p, a)];
  UI.hl = k;
  render();
  let row = document.querySelector('.row[data-k="' + CSS.escape(k) + '"]');
  if (!row) { S.ui.filter = { U: true, T: true, F: true, N: true }; render(); row = document.querySelector('.row[data-k="' + CSS.escape(k) + '"]'); }
  if (row) { row.scrollIntoView({ block: "center" }); row.classList.add("flash"); }
  revealMark();
}
function scrollToClaim(pid, n) {
  const sec = document.getElementById("claim-" + pid + "-" + n);
  if (sec) { sec.scrollIntoView({ block: "start" }); window.scrollBy(0, -document.getElementById("hd").offsetHeight - 4); }
}
// overview table: open the patent (and the claim) in the layer of the clicked column
function jumpTo(pid, n, m) {
  S.ui.tab = pid;
  S.ui.view = m;
  UI.hl = null;
  if (+n) UI.show[pid + ":" + n] = true;
  render();
  if (+n) scrollToClaim(pid, n); else window.scrollTo(0, 0);
}
function setChecks(p, claim, fn) {
  for (const x of p.nodes) if (!claim || x.claim === claim) fn(x, key(p, x));
  change();
}
// the deepest node of the claim whose span covers the clicked character
function pickFromText(e, el) {
  const [pid, n] = [el.dataset.arg.slice(0, el.dataset.arg.lastIndexOf(":")), +el.dataset.arg.slice(el.dataset.arg.lastIndexOf(":") + 1)];
  const p = P[pid], c = p.byN[n];
  let node, off;
  if (document.caretPositionFromPoint) { const cp = document.caretPositionFromPoint(e.clientX, e.clientY); node = cp && cp.offsetNode; off = cp && cp.offset; }
  else if (document.caretRangeFromPoint) { const cr = document.caretRangeFromPoint(e.clientX, e.clientY); node = cr && cr.startContainer; off = cr && cr.startOffset; }
  if (!node) return;
  const upTo = (start) => { const r = document.createRange(); r.setStart(start, 0); r.setEnd(node, off); return r.toString().length; };
  let at;
  const line = (node.nodeType === 1 ? node : node.parentElement).closest("[data-off]");
  if (line && el.contains(line)) at = +line.dataset.off + (line.dataset.whole ? 0 : upTo(line));
  else {
    if (!fmtMatches(p, c)) return;
    const fi = upTo(el);
    const m = offsetMap(c.body, fmtOf(p, c));
    at = 0;
    while (at < c.body.length && m[at + 1] <= fi) at++;
  }
  let best = c.tree;
  (function deeper(x) { for (const k of x.kids) if (k.s <= at && at < k.e) { best = k; deeper(k); } })(c.tree);
  goToNode(key(p, best));
}

const ON_CLICK = {
  tab: (el, e) => { e.preventDefault(); S.ui.tab = el.dataset.arg; UI.hl = null; render(); window.scrollTo(0, 0); },
  jump: (el) => jumpTo(...el.dataset.arg.split("|")),
  node: (el, e) => { e.preventDefault(); goToNode(el.dataset.arg); },
  summary: () => { S.ui.sum = !S.ui.sum; render(); },
  save: () => saveHtml(),
  exportJson: () => exportJson(),
  importJson: () => document.getElementById("jsonFile").click(),
  schema: () => download("claim-chart-result.schema.json", SCHEMA_TEXT, "application/json"),
  view: (el) => { S.ui.view = el.dataset.arg; render(); },
  expandAll: () => { const p = P[S.ui.tab]; if (!p) return; for (const n of p.nodes) delete S.collapsed[key(p, n)]; render(); },
  collapseAll: () => { const p = P[S.ui.tab]; if (!p) return; for (const n of p.nodes) if (n.kids.length && n.parent) S.collapsed[key(p, n)] = true; render(); },
  resetAll: () => { const p = P[S.ui.tab]; if (p && confirm(t("resetAsk"))) setChecks(p, 0, (x, k) => { delete S.checks[k]; delete S.alts[k]; }); },
  resetClaim: (el) => { const n = +el.dataset.arg; if (confirm(confirmText("resetClaimAsk", n))) setChecks(P[S.ui.tab], n, (x, k) => { delete S.checks[k]; delete S.alts[k]; }); },
  adoptAll: () => { const p = P[S.ui.tab]; if (p && confirm(t("adoptAsk"))) adopt(p, 0); },
  adoptClaim: (el) => { const n = +el.dataset.arg; if (confirm(confirmText("adoptClaimAsk", n))) adopt(P[S.ui.tab], n); },
  showClaim: (el) => { UI.show[el.dataset.arg] = !UI.show[el.dataset.arg]; render(); },
  gotoClaim: (el, e) => { e.preventDefault(); UI.show[S.ui.tab + ":" + el.dataset.arg] = true; render(); scrollToClaim(S.ui.tab, el.dataset.arg); },
  editText: (el) => { UI.edit[el.dataset.arg] = !UI.edit[el.dataset.arg]; render(); },
  pickText: (el, e) => pickFromText(e, el),
  check: (el) => { S.checks[rowOf(el).k] = el.dataset.arg; if (el.dataset.arg === "U") delete S.checks[rowOf(el).k]; change(); },
  reading: (el) => { S.alts[rowOf(el).k] = el.dataset.arg; change(); },
  memo: (el) => { const k = rowOf(el).k; UI.memoOpen[k] = !UI.memoOpen[k]; render(); },
  twisty: (el) => { const r = rowOf(el); if (r.node.kids.length) { S.collapsed[r.k] = !S.collapsed[r.k]; render(); } },
  rowText: (el, e) => { if (e.target.closest("a")) return; const k = rowOf(el).k; UI.hl = UI.hl === k ? null : k; render(); revealMark(); },
};
function adopt(p, claim) {
  setChecks(p, claim, (x, k) => { const a = checkable(x) ? aiOf(p, x) : null; if (a && a.v !== "U" && !S.checks[k]) S.checks[k] = a.v; });
  S.ui.view = "user";
  render();
}
const clampFont = (v) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(20, Math.max(8, n)) : 14; };
const ON_CHANGE = {
  filter: (el) => { S.ui.filter[el.dataset.arg] = el.checked; render(); },
  mode: (el) => { S.ui.mode = el.value; render(); },
  layout: (el) => { S.ui.layout = el.value; render(); },
  text: (el) => { S.ui.text = el.value; render(); revealMark(); },
  aiReason: (el) => { S.ui.aiReason = el.checked; render(); },
  trLang: (el) => { S.ui.tr = el.value; render(); },
  menuLang: (el) => { S.ui.lang = el.value; render(); },
  theme: (el) => { S.ui.theme = el.value; render(); },
  fs: (el) => { S.ui.fs = clampFont(el.value); render(); },
  ofs: (el) => { S.ui.ofs = clampFont(el.value); render(); },
  memoInput: () => render(),
  jsonFile: (el) => { if (el.files[0]) el.files[0].text().then(importJson); el.value = ""; },
};
const ON_INPUT = {
  memoInput: (el) => { if (el.value) S.memos[el.dataset.arg] = el.value; else delete S.memos[el.dataset.arg]; dirty = true; },
  fmtInput: (el) => {
    const fk = el.dataset.arg;
    S.fmt[fk] = el.value;
    dirty = true;
    const i = fk.lastIndexOf(":");
    const ok = fmtMatches(P[fk.slice(0, i)], P[fk.slice(0, i)].byN[+fk.slice(i + 1)]);
    document.querySelector('[data-okfor="' + CSS.escape(fk) + '"]').textContent = ok ? "" : "✗ " + t("mismatch");
  },
};
const dispatch = (table) => (e) => {
  const el = e.target.closest("[data-act]");
  if (el && table[el.dataset.act]) table[el.dataset.act](el, e);
};
document.addEventListener("click", dispatch(ON_CLICK));
document.addEventListener("change", dispatch(ON_CHANGE));
document.addEventListener("input", dispatch(ON_INPUT));
window.addEventListener("resize", () => document.documentElement.style.setProperty("--hdh", document.getElementById("hd").offsetHeight + "px"));
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = t("leave"); } });

// ==================================================================== 8 bars
// mid bar: width of the claim text pane (side by side) or its height (stacked);
// bottom bar: height of every claim box. Double-click puts them back.
document.addEventListener("pointerdown", (e) => {
  const bar = e.target.closest("[data-bar]");
  if (!bar) return;
  e.preventDefault();
  const bottom = bar.dataset.bar === "bottom";
  const box = bottom ? bar.previousElementSibling : bar.parentElement;
  bar.classList.add("dragging");
  bar.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const r = box.getBoundingClientRect();
    if (bottom) S.ui.ch = Math.round(Math.min(4000, Math.max(150, ev.clientY - r.top)));
    else if (S.ui.layout === "lr") S.ui.split = Math.round(Math.min(85, Math.max(15, (ev.clientX - r.left) / r.width * 100)));
    else S.ui.oh = Math.round(Math.min(window.innerHeight - 120, Math.max(40, ev.clientY - r.top)));
    applyLook();
  };
  const up = () => { bar.classList.remove("dragging"); bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); dirty = true; };
  bar.addEventListener("pointermove", move);
  bar.addEventListener("pointerup", up);
});
document.addEventListener("dblclick", (e) => {
  const bar = e.target.closest("[data-bar]");
  if (!bar) return;
  if (bar.dataset.bar === "bottom") S.ui.ch = null;
  else if (S.ui.layout === "lr") S.ui.split = 40;
  else S.ui.oh = null;
  change();
});

// ==================================================================== 9 save and JSON
const fileStem = () => "claim-chart-" + DATA.patents.map((p) => p.id).join("_") + "-" + stamp().replace(/[-: ]/g, "");
function saveHtml() {
  S.savedAt = stamp();
  const json = JSON.stringify(S).replace(/</g, "\\u003c");
  const re = /(<script type="application\/json" id="cc-state">)[\s\S]*?(<\/script>)/;
  download(fileStem() + ".html", PRISTINE.replace(re, (_, a, b) => a + json + b), "text/html");
  dirty = false;
  render();
}

// claim-chart-result/1 (schema/claim-chart-result.schema.json): every node of every claim
function exportJson() {
  refresh();
  const nodeJson = (p, n) => {
    const k = key(p, n);
    const o = { id: n.id, parent: n.parent ? n.parent.id : null, kind: n.k };
    if (n.k === "and" || n.k === "or") o.gate = gateOf(p, n);
    if (n.k === "ref") o.ref = n.ref;
    o.text = n.text;
    if (n.ie) o.ie = n.ie;
    o.checkable = checkable(n);
    if (o.checkable) o.check = TO_JSON[answer(p, n, "user")];
    const ai = o.checkable ? aiOf(p, n) : null;
    if (ai) Object.assign(o, { aiCheck: TO_JSON[ai.v], aiReason: ai.reason, aiEvidence: ai.evidence });
    if (n.alt) o.reading = S.alts[k] || n.k;
    o.value = TO_JSON[val(p, n, "user")];
    o.aiValue = TO_JSON[val(p, n, "ai")];
    o.worthChecking = worth(p, n, "user");
    if (S.memos[k]) o.memo = S.memos[k];
    const trs = Object.assign({}, n.tr || {}, S.trImp[k] || {});
    if (Object.keys(trs).length) o.tr = trs;
    return o;
  };
  const out = {
    format: "claim-chart-result/1", generated: DATA.generated, exported: stamp(), disclaimer: TXT.en.disclaimer,
    patents: DATA.patents.map((p) => ({
      id: p.id, number: p.number, country: p.country, title: p.title, holder: p.holder, status: p.status, source: p.source,
      verdict: TO_JSON[patentVal(p, "user")], aiVerdict: TO_JSON[patentVal(p, "ai")],
      ai: p.ai ? { target: p.ai.target, by: p.ai.by, date: p.ai.date } : undefined,
      claims: p.claims.map((c) => ({ n: c.n, header: c.header, cites: c.refs, verdict: TO_JSON[val(p, c.tree, "user")],
        aiVerdict: TO_JSON[val(p, c.tree, "ai")], nodes: p.nodes.filter((n) => n.claim === c.n).map((n) => nodeJson(p, n)) })),
    })),
  };
  download(fileStem() + ".json", JSON.stringify(out, null, 2), "application/json");
}

// Read back what a person or an AI may change: check, reading, memo, aiCheck/aiReason/aiEvidence, tr.
// A node whose text differs from the claim is skipped, so answers cannot land on the wrong text.
function importJson(text) {
  let doc;
  try { doc = JSON.parse(text); } catch (err) { toast(t("badJson")); return; }
  if (!doc || doc.format !== "claim-chart-result/1" || !Array.isArray(doc.patents)) { toast(t("badJson")); return; }
  const holes = (s) => (String(s).match(HOLE) || []).map((h) => h.slice(1, -1)).sort().join("|");
  let applied = 0, skipped = 0, missing = 0;
  for (const dp of doc.patents) {
    const p = P[dp.id];
    for (const dc of dp.claims || []) {
      for (const dn of dc.nodes || []) {
        const n = p && p.byId[dn.id];
        if (!n || n.claim !== dc.n) { missing++; continue; }
        if (dn.text !== undefined && dn.text !== n.text) { skipped++; continue; }
        const k = key(p, n);
        let used = false;
        if (checkable(n) && dn.check in FROM_JSON) {
          if (FROM_JSON[dn.check] === "U") delete S.checks[k]; else S.checks[k] = FROM_JSON[dn.check];
          used = true;
        }
        if (n.alt && (dn.reading === "or" || dn.reading === "and")) { S.alts[k] = dn.reading; used = true; }
        if (checkable(n) && dn.aiCheck in FROM_JSON) {
          const ev = Array.isArray(dn.aiEvidence) ? dn.aiEvidence.filter((x) => x && typeof x.file === "string" && typeof x.quote === "string")
            .map((x) => ({ file: x.file, line: Number.isInteger(x.line) ? x.line : 0, quote: x.quote })) : [];
          S.aiImp[k] = { v: FROM_JSON[dn.aiCheck], reason: typeof dn.aiReason === "string" ? dn.aiReason : "", evidence: ev };
          used = true;
        }
        if (dn.tr && typeof dn.tr === "object") {
          const want = n.kids.map((x) => x.label).sort().join("|");
          for (const [lang, s] of Object.entries(dn.tr)) {
            if (typeof s !== "string" || holes(s) !== want || (n.tr && n.tr[lang] === s)) continue;
            (S.trImp[k] = S.trImp[k] || {})[lang] = s;
            used = true;
          }
        }
        if (typeof dn.memo === "string") { if (dn.memo) S.memos[k] = dn.memo; else delete S.memos[k]; used = true; }
        if (used) applied++;
      }
    }
  }
  dirty = true;
  render();
  toast(t("imported").replace("{a}", applied).replace("{b}", skipped).replace("{c}", missing));
}

// ==================================================================== 10 start
render();
</script>
</body>
